[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qyra-lang"
version = "0.3.0a1"
description = "Experimental Qyra language bootstrap compiler and bytecode virtual machine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Трифон Ярослав Владимирович (Nexu_scoder)"}]
keywords = ["programming-language", "compiler", "bytecode", "virtual-machine", "qyra"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Compilers",
]

[project.scripts]
qyra = "qyra.cli:main"

[tool.setuptools.packages.find]
include = ["qyra*"]
